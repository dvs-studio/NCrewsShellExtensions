name: Build NCrewsShellExtensions (Windows x64 Release)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x64
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  THIRDPARTY_ROOT: ${{ github.workspace }}/3rdpartylibs

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and Ninja
        run: |
          choco install cmake ninja -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-opencv-tinyxml2-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg and install packages
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          }
          Push-Location "${{ env.VCPKG_ROOT }}"
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
          .\vcpkg install opencv[core,imgproc,imgcodecs,world]:x64-windows tinyxml2:x64-windows --clean-after-build
          Pop-Location

      - name: Create 3rd-party directory structure
        shell: pwsh
        run: |
          $dirs = @(
            "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\include",
            "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\lib",
            "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\bin",
            "${{ env.THIRDPARTY_ROOT }}\Open3D19\build\bin\resources",
            "${{ env.THIRDPARTY_ROOT }}\LAStools\LASlib\inc",
            "${{ env.THIRDPARTY_ROOT }}\LAStools\LASlib\lib\Release",
            "${{ env.THIRDPARTY_ROOT }}\opencv\build\include",
            "${{ env.THIRDPARTY_ROOT }}\opencv\build\x64\vc16\lib",
            "${{ env.THIRDPARTY_ROOT }}\TinyXML\Inc",
            "${{ env.THIRDPARTY_ROOT }}\TinyXML\Source"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Write-Host "3rd-party directory structure created."

      - name: Patch vcxproj files (replace hardcoded paths)
        shell: pwsh
        run: |
          $files = @(
            "build\ModelShellExtension.vcxproj",
            "build\CloudShellExtension.vcxproj"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              Write-Warning "File not found: $file"
              continue
            }

            $content = Get-Content -Path $file -Raw

            # Replace author's hardcoded paths
            $content = $content -replace 'D:\\3rdpartylibs\\Open3D19', '${{ env.THIRDPARTY_ROOT }}\Open3D19'
            $content = $content -replace 'D:/3rdpartylibs/Open3D19', '${{ env.THIRDPARTY_ROOT }}/Open3D19'
            $content = $content -replace 'D:\\3rdpartylibs\\Open3D18', '${{ env.THIRDPARTY_ROOT }}\Open3D19'
            $content = $content -replace 'D:/3rdpartylibs/Open3D18', '${{ env.THIRDPARTY_ROOT }}/Open3D19'
            $content = $content -replace 'D:\\3rdpartylibs\\LAStools-2.0.3', '${{ env.THIRDPARTY_ROOT }}\LAStools'
            $content = $content -replace 'D:\\3rdpartylibs\\opencv', '${{ env.THIRDPARTY_ROOT }}\opencv'
            $content = $content -replace 'D:\\3rdpartylibs\\TinyXML', '${{ env.THIRDPARTY_ROOT }}\TinyXML'
            $content = $content -replace 'D:\\github\\vcpkg', '${{ env.VCPKG_ROOT }}'

            Set-Content -Path $file -Value $content -NoNewline
            Write-Host "Patched: $file"
          }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found"
          }
          echo "MSBUILD_PATH=$msbuild" >> $env:GITHUB_OUTPUT
          Write-Host "Using MSBuild: $msbuild"

      - name: Build ModelShellExtension
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" `
            "build\ModelShellExtension.vcxproj" `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /p:PlatformToolset=v143 `
            /m /v:minimal /nologo
        continue-on-error: true

      - name: Build CloudShellExtension
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" `
            "build\CloudShellExtension.vcxproj" `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /p:PlatformToolset=v143 `
            /m /v:minimal /nologo
        continue-on-error: true

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Get-ChildItem -Path "build" -Recurse -Include "*.dll","*.pdb" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "Release|x64" } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $out -Force
              Write-Host "Collected: $($_.Name)"
            }

          $count = (Get-ChildItem $out -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -eq 0) {
            Write-Warning "No DLLs found. Build failed due to missing Open3D / LASLib binaries."
          } else {
            Write-Host "Collected $count file(s)."
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NCrewsShellExtensions-x64-Release
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
