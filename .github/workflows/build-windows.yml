name: Build NCrewsShellExtensions (Windows x64 Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger

env:
  SOLUTION_DIR: build
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x64
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  THIRDPARTY_ROOT: ${{ github.workspace }}/3rdpartylibs

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180          # Open3D can take a long time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake & Ninja
        run: |
          choco install cmake ninja -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}-opencv-tinyxml2
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg + install OpenCV & TinyXML2
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          }
          cd ${{ env.VCPKG_ROOT }}
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
          .\vcpkg install opencv[core,imgproc,imgcodecs,world]:x64-windows tinyxml2:x64-windows --clean-after-build

      - name: Prepare 3rd-party layout (placeholder structure)
        shell: pwsh
        run: |
          # Create the directory layout the .vcxproj files expect
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\include"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\lib"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\Open3D19\install\bin"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\Open3D19\build\bin\resources"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\LAStools\LASlib\inc"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\LAStools\LASlib\lib\Release"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\opencv\build\include"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\opencv\build\x64\vc16\lib"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\TinyXML\Inc"
          New-Item -ItemType Directory -Force -Path "${{ env.THIRDPARTY_ROOT }}\TinyXML\Source"

          Write-Host "NOTE: Full Open3D + LASLib source builds are very heavy."
          Write-Host "This workflow installs what is practical via vcpkg and prepares the path layout."
          Write-Host "You will still need to supply pre-built Open3D + LASLib binaries or extend this job."

      - name: Patch .vcxproj paths (replace author's hardcoded D: paths)
        shell: pwsh
        run: |
          $files = @(
            "build\ModelShellExtension.vcxproj",
            "build\CloudShellExtension.vcxproj"
          )

          $replacements = @{
            # Open3D
            'D:\\3rdpartylibs\\Open3D19' = '${{ env.THIRDPARTY_ROOT }}\Open3D19'
            'D:/3rdpartylibs/Open3D19'   = '${{ env.THIRDPARTY_ROOT }}/Open3D19'
            'D:\\3rdpartylibs\\Open3D18' = '${{ env.THIRDPARTY_ROOT }}\Open3D19'
            'D:/3rdpartylibs/Open3D18'   = '${{ env.THIRDPARTY_ROOT }}/Open3D19'
            # LAS tools
            'D:\\3rdpartylibs\\LAStools-2.0.3' = '${{ env.THIRDPARTY_ROOT }}\LAStools'
            # OpenCV
            'D:\\3rdpartylibs\\opencv' = '${{ env.THIRDPARTY_ROOT }}\opencv'
            # TinyXML
            'D:\\3rdpartylibs\\TinyXML' = '${{ env.THIRDPARTY_ROOT }}\TinyXML'
            # vcpkg (if any absolute paths remain)
            'D:\\github\\vcpkg' = '${{ env.VCPKG_ROOT }}'
          }

          foreach ($file in $files) {
            if (Test-Path $file) {
              $content = Get-Content $file -Raw
              foreach ($old in $replacements.Keys) {
                $content = $content -replace [regex]::Escape($old), $replacements[$old]
              }
              Set-Content -Path $file -Value $content -NoNewline
              Write-Host "Patched: $file"
            } else {
              Write-Warning "File not found: $file"
            }
          }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          echo "MSBUILD_PATH=$msbuild" >> $env:GITHUB_OUTPUT
          Write-Host "Using MSBuild: $msbuild"

      - name: Build ModelShellExtension (Release|x64)
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" `
            "build\ModelShellExtension.vcxproj" `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /p:PlatformToolset=v143 `
            /m /v:minimal /nologo
        continue-on-error: true   # will fail until Open3D/LASLib are properly supplied

      - name: Build CloudShellExtension (Release|x64)
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" `
            "build\CloudShellExtension.vcxproj" `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /p:PlatformToolset=v143 `
            /m /v:minimal /nologo
        continue-on-error: true

      - name: Collect build artifacts
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Search common output locations
          $patterns = @(
            "build\**\Release\*.dll",
            "build\**\x64\Release\*.dll",
            "build\**\${{ env.BUILD_CONFIG }}\*.dll"
          )

          Get-ChildItem -Path $patterns -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $out -Force
              Write-Host "Collected: $($_.Name)"
            }

          # Also copy any .pdb for debugging
          Get-ChildItem -Path "build\**\*.pdb" -Recurse -ErrorAction SilentlyContinue |
            Copy-Item -Destination $out -Force -ErrorAction SilentlyContinue

          if ((Get-ChildItem $out -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Write-Warning "No DLLs found. Build most likely failed due to missing Open3D / LASLib."
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NCrewsShellExtensions-x64-Release
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
